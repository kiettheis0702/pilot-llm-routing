[project]
name = "pilot-llm-routing"
version = "0.1.0"
description = "Student reproduction of PILOT, starting with a reproducible data audit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18",
]

[project.optional-dependencies]
# Match the pinned RouterBench cost converter; no generation SDK is required.
cost = ["tiktoken==0.5.2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
