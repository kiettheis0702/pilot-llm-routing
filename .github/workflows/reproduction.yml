name: Offline reproduction
on:
  workflow_dispatch:
  push:
    branches: [codex/reproduction-followups]
permissions:
  contents: read
concurrency:
  group: offline-reproduction
  cancel-in-progress: false
jobs:
  verify:
    # Standard public-repository runners are free; never allocate for a private fork.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      UV_CONCURRENT_DOWNLOADS: '1'
      UV_CONCURRENT_INSTALLS: '1'
      UV_CONCURRENT_BUILDS: '1'
      PYTHONUTF8: '1'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: 'false'
      - name: Install a new locked environment
        shell: pwsh
        run: |
          $availableGiB = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          if ($availableGiB -lt 8) { throw "Need 8 GiB physical RAM; found $availableGiB" }
          uv sync --locked --python 3.11.18 --extra cost --extra tracking --extra openai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .cache -Force | Out-Null
      - name: Restore and checksum the public tokenizer vocabulary
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "import tiktoken; from scripts.cost_inputs import HistoricalCounter; tiktoken.get_encoding('cl100k_base'); print(HistoricalCounter().metadata)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full serial regression
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "from scripts.resources import require_resources; print(require_resources())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q -rs --basetemp=.cache/ci-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore inputs and replay preparation twice
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage inputs
      - name: Refit Preference500 on all three seeds
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage preference
      - name: Refit after flipping only final-test labels
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage mutation
      - name: Rebuild and independently replay six parent PILOT groups
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage parents
      - name: Exercise all five ablations on RouterBench seed7
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage ablations
      - name: Replay all five allocation policies on RouterBench seed7
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage budget
      - name: Replay zero and one-percent feedback noise
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage noise
      - name: Fresh binary tuning and all seven methods on seed7
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage binary
      - name: Compare replays with published values and record coverage
        shell: pwsh
        run: tools/reproduction-ci.ps1 -Stage summary
