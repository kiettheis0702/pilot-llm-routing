name: Offline reproduction
on:
  workflow_dispatch:
  push:
    branches: [codex/reproduction-followups]
permissions:
  contents: read
concurrency:
  group: offline-reproduction
  cancel-in-progress: false
jobs:
  verify:
    # Standard public-repository runners are free; never allocate for a private fork.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      UV_CONCURRENT_DOWNLOADS: '1'
      UV_CONCURRENT_INSTALLS: '1'
      UV_CONCURRENT_BUILDS: '1'
      PYTHONUTF8: '1'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: 'false'
      - name: Install a new locked environment
        shell: pwsh
        run: |
          $availableGiB = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          if ($availableGiB -lt 8) { throw "Need 8 GiB physical RAM; found $availableGiB" }
          uv sync --locked --python 3.11.18 --extra cost --extra tracking --extra openai
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path .cache -Force | Out-Null
      - name: Restore and checksum the public tokenizer vocabulary
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "import tiktoken; from scripts.cost_inputs import HistoricalCounter; tiktoken.get_encoding('cl100k_base'); print(HistoricalCounter().metadata)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Baseline regression
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "from scripts.resources import require_resources; print(require_resources())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q -rs --ignore=tests/test_reproduce_followups.py --basetemp=.cache/ci-baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Confirm missing entrypoints fail before implementation
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -c "from scripts.resources import require_resources; print(require_resources())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & .venv/Scripts/python.exe -m pytest tests/test_reproduce_followups.py -q --basetemp=.cache/ci-red 2>&1
          $testExit = $LASTEXITCODE
          $output | Write-Output
          if ($testExit -ne 1 -or ($output -join "`n") -notmatch '8 failed' -or ($output -join "`n") -notmatch "No module named 'tools.openai_study_reproduce'") { throw 'Expected eight missing-entrypoint failures' }
          exit 0
